<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unamove — offline</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="topbar"><a class="brand" href="/">Unamove</a></header>
<main class="wrap narrow" style="padding-top:60px">
  <div class="routeboard"><span class="from">No signal</span><span class="arrow">&rarr;</span><span class="to">Try again</span></div>
  <p style="margin-top:20px">Unamove needs a connection to show live bookings. Check your data or WiFi, then reload.</p>
  <button class="primary" onclick="location.reload()">Reload</button>
</main>
</body>
</html>
